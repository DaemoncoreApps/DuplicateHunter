name: Verify Windows app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run smoke
      - run: npm run startup:check
      - run: npm run package:store
      - run: npm run verify:store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: |
            artifacts/
            release/*.appx
          if-no-files-found: ignore
